<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --gold: #C9A84C;
  --gold-light: #E8C97A;
  --cream: #F5F0E8;
}
html, body { width:100%; height:100%; background:#000; overflow:hidden; font-family:'Inter',sans-serif; }

/* ── STAGE ── */
#stage { position:relative; width:100%; height:100vh; }

/* ── SLIDE ── */
.slide {
  position:absolute; inset:0;
  display:flex; align-items:center; justify-content:center;
  opacity:0; pointer-events:none;
  transition: opacity 1.3s cubic-bezier(0.4,0,0.2,1);
}
.slide.active { opacity:1; pointer-events:auto; }

/* Full-bleed background */
.slide-bg {
  position:absolute; inset:0;
  background-size:cover; background-position:center;
  transform:scale(1.07);
  transition: transform 7s ease-out;
}
.slide.active .slide-bg { transform:scale(1); }

/* Dark vignette always so text is readable */
.slide-vignette {
  position:absolute; inset:0;
  background: radial-gradient(ellipse at center, transparent 30%, rgba(0,0,0,0.6) 100%);
  pointer-events:none; z-index:1;
}

/* Color grade per slide */
.slide-grade {
  position:absolute; inset:0;
  pointer-events:none; z-index:1;
}

/* Left text fade */
.slide-left-fade {
  position:absolute; inset:0;
  background: linear-gradient(to right, rgba(0,0,0,0.82) 0%, rgba(0,0,0,0.55) 35%, transparent 65%);
  pointer-events:none; z-index:2;
}

/* ── BOOK CARD ── */
.book-card {
  position:relative; z-index:3;
  width:320px; height:480px;
  border-radius:4px; overflow:hidden; flex-shrink:0;
  box-shadow: 0 50px 140px rgba(0,0,0,0.95), 0 0 0 1px rgba(255,255,255,0.07);
  transform: perspective(1400px) rotateY(-8deg) translateY(28px) scale(0.94);
  transition: transform 1.5s cubic-bezier(0.34,1.56,0.64,1), box-shadow 1.5s ease;
  margin-left: 80px;
}
.slide.active .book-card {
  transform: perspective(1400px) rotateY(-4deg) translateY(0) scale(1);
  box-shadow: 0 70px 180px rgba(0,0,0,0.98), 0 0 0 1px rgba(255,255,255,0.09);
}

/* Book photo fills the card */
.book-photo {
  position:absolute; inset:0;
  background-size:cover; background-position:center;
}

/* Gradient so text is readable on book */
.book-gradient {
  position:absolute; inset:0;
}

/* Book top logo */
.book-top {
  position:absolute; top:0; left:0; right:0;
  padding:18px 20px;
  display:flex; justify-content:space-between; align-items:center;
  z-index:2;
}
.book-logo {
  font-family:'Inter',sans-serif; font-size:7px;
  font-weight:800; letter-spacing:4px; text-transform:uppercase;
  color:rgba(255,255,255,0.35);
}

/* Book text overlay */
.book-overlay {
  position:absolute; inset:0; z-index:2;
  display:flex; flex-direction:column; justify-content:flex-end;
  padding:24px 22px;
}
.book-genre {
  font-family:'Inter',sans-serif; font-size:8px;
  font-weight:700; letter-spacing:3.5px; text-transform:uppercase;
  color:var(--gold); margin-bottom:9px;
  opacity:0; transform:translateY(6px);
  transition: all 0.6s ease 0.5s;
}
.slide.active .book-genre { opacity:1; transform:translateY(0); }

.book-title {
  color:var(--cream); line-height:1.05; margin-bottom:9px;
  opacity:0; transform:translateY(10px);
  transition: all 0.7s ease 0.65s;
  text-shadow: 0 2px 16px rgba(0,0,0,0.9);
}
.slide.active .book-title { opacity:1; transform:translateY(0); }

.book-subtitle {
  font-size:11px; line-height:1.4; margin-bottom:14px;
  opacity:0; transform:translateY(6px);
  transition: all 0.6s ease 0.8s;
  text-shadow: 0 1px 8px rgba(0,0,0,0.9);
}
.slide.active .book-subtitle { opacity:1; transform:translateY(0); }

.book-divider {
  width:28px; height:1px; background:var(--gold);
  margin-bottom:10px;
  opacity:0; transform:scaleX(0); transform-origin:left;
  transition: all 0.5s ease 0.95s;
}
.slide.active .book-divider { opacity:1; transform:scaleX(1); }

.book-author {
  font-family:'Inter',sans-serif; font-size:10px;
  font-weight:700; letter-spacing:3px; text-transform:uppercase;
  color:var(--gold-light);
  opacity:0; transform:translateY(5px);
  transition: all 0.5s ease 1.1s;
}
.slide.active .book-author { opacity:1; transform:translateY(0); }

/* ── LEFT INFO PANEL ── */
.slide-info {
  position:absolute; z-index:4;
  top:0; left:0; bottom:0;
  width:42%; display:flex; flex-direction:column; justify-content:center;
  padding:0 0 0 56px;
}
.slide-eyebrow {
  font-family:'Inter',sans-serif; font-size:9px;
  font-weight:700; letter-spacing:4px; text-transform:uppercase;
  color:var(--gold); margin-bottom:14px;
  opacity:0; transition: opacity 0.6s ease 0.7s;
}
.slide.active .slide-eyebrow { opacity:1; }

.slide-title-big {
  font-family:'Playfair Display',serif; font-weight:900;
  font-size:52px; line-height:1.0; color:#fff;
  margin-bottom:16px;
  opacity:0; transform:translateY(16px);
  transition: all 0.9s ease 0.85s;
  text-shadow: 0 4px 32px rgba(0,0,0,0.8);
}
.slide.active .slide-title-big { opacity:1; transform:translateY(0); }

.slide-desc {
  font-family:'Inter',sans-serif; font-size:13px;
  font-weight:300; line-height:1.65;
  color:rgba(255,255,255,0.5);
  opacity:0; transform:translateY(10px);
  transition: all 0.7s ease 1.05s;
}
.slide.active .slide-desc { opacity:1; transform:translateY(0); }

/* ── ENDING ── */
#ending {
  position:absolute; inset:0;
  background:#060504;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  opacity:0; pointer-events:none;
  transition: opacity 1.5s ease;
  z-index:10;
}
#ending.active { opacity:1; pointer-events:auto; }
.ending-eyebrow {
  font-family:'Inter',sans-serif; font-size:9px; font-weight:700;
  letter-spacing:6px; text-transform:uppercase; color:var(--gold);
  margin-bottom:28px; opacity:0; transition: opacity 0.7s ease 0.5s;
}
#ending.active .ending-eyebrow { opacity:1; }
.ending-title {
  font-family:'Cormorant Garamond',serif; font-size:80px;
  font-weight:300; font-style:italic; color:#fff;
  text-align:center; line-height:1.05;
  opacity:0; transform:translateY(20px);
  transition: all 1.1s ease 0.8s;
}
#ending.active .ending-title { opacity:1; transform:translateY(0); }
.ending-rule {
  width:1px; height:64px;
  background:linear-gradient(to bottom, var(--gold), transparent);
  margin:32px auto; opacity:0; transition: opacity 0.6s ease 1.6s;
}
#ending.active .ending-rule { opacity:1; }
.ending-brand {
  font-family:'Inter',sans-serif; font-size:11px; font-weight:700;
  letter-spacing:7px; text-transform:uppercase;
  color:rgba(255,255,255,0.3);
  opacity:0; transition: opacity 0.6s ease 1.9s;
}
#ending.active .ending-brand { opacity:1; }
.ending-cta {
  margin-top:52px;
  font-family:'Inter',sans-serif; font-size:10px; font-weight:700;
  letter-spacing:4px; text-transform:uppercase; color:var(--gold);
  border:1px solid rgba(201,168,76,0.35); padding:14px 36px; border-radius:2px;
  cursor:pointer; opacity:0; transition: opacity 0.5s ease 2.2s, background 0.2s;
}
#ending.active .ending-cta { opacity:1; }
.ending-cta:hover { background:rgba(201,168,76,0.08); }

/* ── PROGRESS BAR ── */
#progress-bar {
  position:fixed; bottom:0; left:0; right:0;
  height:2px; background:rgba(255,255,255,0.05); z-index:100;
}
#progress-fill {
  height:100%;
  background:linear-gradient(to right, var(--gold), var(--gold-light));
  width:0%; transition:width linear;
}

/* ── TOP UI ── */
#watermark {
  position:fixed; top:28px; left:44px; z-index:100;
  font-family:'Inter',sans-serif; font-size:10px;
  font-weight:800; letter-spacing:5px; text-transform:uppercase;
  color:rgba(255,255,255,0.22);
}
#watermark em { color:var(--gold); font-style:normal; }
#counter {
  position:fixed; top:28px; right:44px; z-index:100;
  font-family:'Inter',sans-serif; font-size:10px;
  font-weight:300; letter-spacing:2px; color:rgba(255,255,255,0.25);
}
#counter strong { color:rgba(255,255,255,0.65); font-weight:400; }

/* ── DOTS ── */
#dots {
  position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
  display:flex; gap:8px; z-index:100;
}
.dot {
  width:5px; height:5px; border-radius:50%;
  background:rgba(255,255,255,0.18); cursor:pointer;
  transition:all 0.35s;
}
.dot.active { background:var(--gold); width:22px; border-radius:3px; }

/* ── MUTE BTN ── */
#mute-btn {
  position:fixed; bottom:14px; right:44px; z-index:100;
  background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.1);
  color:rgba(255,255,255,0.4); width:36px; height:36px; border-radius:50%;
  cursor:pointer; font-size:15px;
  display:flex; align-items:center; justify-content:center;
  transition:all 0.2s; backdrop-filter:blur(8px);
}
#mute-btn:hover { background:rgba(255,255,255,0.12); color:#fff; }
</style>

<!-- UI -->
<div id="progress-bar"><div id="progress-fill"></div></div>
<div id="dots"></div>

<script>
// ════════════════════════════════════════
// MUSIC — ElevenLabs track
// ════════════════════════════════════════
const music = document.getElementById('bgMusic');
music.volume = 0;
let isMuted = false;
let musicStarted = false;

function startMusic() {
  if (musicStarted) return;
  musicStarted = true;
  music.play().then(() => {
    fadeIn();
  }).catch(() => {
    musicStarted = false; // retry on next interaction
  });
}

function fadeIn() {
  const target = 0.72;
  const step = () => {
    if (music.volume < target) {
      music.volume = Math.min(music.volume + 0.015, target);
      setTimeout(step, 60);
    }
  };
  step();
}

function fadeOut() {
  const step = () => {
    if (music.volume > 0.01) {
      music.volume = Math.max(music.volume - 0.02, 0);
      setTimeout(step, 60);
    } else { music.pause(); }
  };
  step();
}

function initAudio() { startMusic(); }

function toggleMute() {
  isMuted = !isMuted;
  if (isMuted) {
    music.volume = 0;
  } else {
    if (!musicStarted) startMusic();
    else { music.volume = 0; fadeIn(); }
  }
  document.getElementById('mute-btn').textContent = isMuted ? '🔇' : '🔊';
}

document.getElementById('mute-btn').addEventListener('click', e => {
  e.stopPropagation();
  if (!musicStarted) startMusic();
  else toggleMute();
});

// Try autoplay immediately
music.play().then(() => {
  musicStarted = true;
  fadeIn();
}).catch(() => {
  // Blocked — will start on first user gesture
  console.log('Autoplay blocked — will start on first click');
});

// Also start on any key press
document.addEventListener('keydown', () => { if (!isMuted) startMusic(); }, { once: false });

// ════════════════════════════════════════
// SLIDESHOW ENGINE
// ════════════════════════════════════════
const slides = document.querySelectorAll('.slide');
const ending = document.getElementById('ending');
const currEl = document.getElementById('curr');
const fill   = document.getElementById('progress-fill');
const dotsEl = document.getElementById('dots');

let current = 0, timer = null;

// Build dots
slides.forEach((_, i) => {
  const d = document.createElement('div');
  d.className = 'dot' + (i===0?' active':'');
  d.addEventListener('click', () => goTo(i));
  dotsEl.appendChild(d);
});

function getDur(i) { return parseInt(slides[i].dataset.duration) || 6000; }

function goTo(index) {
  clearTimeout(timer);

  // Hide current
  slides[current].classList.remove('active');
  dotsEl.children[current].classList.remove('active');

  current = index;

  if (current >= slides.length) { showEnding(); return; }

  slides[current].classList.add('active');
  dotsEl.children[current].classList.add('active');
  currEl.textContent = String(current+1).padStart(2,'0');

  const dur = getDur(current);
  fill.style.transition = 'none';
  fill.style.width = '0%';
  requestAnimationFrame(() => requestAnimationFrame(() => {
    fill.style.transition = `width ${dur}ms linear`;
    fill.style.width = '100%';
  }));

  timer = setTimeout(() => goTo(current + 1), dur);
}

function showEnding() {
  fill.style.width = '100%';
  dotsEl.style.opacity = '0';
  ending.classList.add('active');
  fadeOut();
}

function restart() {
  ending.classList.remove('active');
  dotsEl.style.opacity = '1';
  current = 0;
  slides.forEach(s => s.classList.remove('active'));
  if (!isMuted) fadeIn();
  setTimeout(() => goTo(0), 80);
}

// Keyboard
document.addEventListener('keydown', e => {
  if (e.key==='ArrowRight') goTo(Math.min(current+1, slides.length));
  if (e.key==='ArrowLeft')  goTo(Math.max(current-1, 0));
  if (e.key==='r'||e.key==='R') restart();
  if (e.key==='m'||e.key==='M') toggleMute();
});

// Click stage to advance (skip mute button)
document.getElementById('stage').addEventListener('click', () => {
  if (!ending.classList.contains('active')) {
    initAudio(); // start music on first click
    goTo(current + 1);
  }
});

// Start
goTo(0);
</script>
